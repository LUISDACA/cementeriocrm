# Render Blueprint para una instalación aislada de CementerioERP.
# Crea recursos nuevos; no comparte ni adopta servicios de otros proyectos.
services:
  - type: web
    name: cementerioerp-web
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: cementerioerp-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: require
      - key: CEMETERY_NAME
        value: CementerioERP
      - key: CEMETERY_CURRENCY
        value: COP
      - key: CEMETERY_MOVEMENTS_APPROVED
        value: "0"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: cementerioerp-db
    databaseName: cementerioerp
    user: cementerioerp
    plan: 0.1c-256mb
    diskSizeGB: 15
    region: virginia
    postgresMajorVersion: "17"
