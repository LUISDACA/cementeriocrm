# Render Blueprint para una instalación aislada de CementerioERP.
# Crea recursos nuevos; no comparte ni adopta servicios de otros proyectos.
services:
  - type: web
    name: cementerioerp-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_academic
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: cementerioerp-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: require
      - key: CEMETERY_NAME
        value: CementerioERP
      - key: CEMETERY_CURRENCY
        value: COP
      - key: CEMETERY_MOVEMENTS_APPROVED
        value: "0"
      - key: CEMETERY_AUTO_SEED_DEMO
        value: "1"
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: cementerioerp-db
    databaseName: cementerioerp
    user: cementerioerp
    plan: free
    region: virginia
    postgresMajorVersion: "17"
