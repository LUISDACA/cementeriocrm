services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cementerio
      POSTGRES_USER: cementerio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cementerio -d cementerio"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DATABASE_URL: postgresql://cementerio:${POSTGRES_PASSWORD}@db:5432/cementerio
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CEMETERY_MOVEMENTS_APPROVED: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
