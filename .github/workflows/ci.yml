name: CementerioERP
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cementerio
          POSTGRES_USER: cementerio
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cementerio -d cementerio"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-never-deploy-this-value
      DATABASE_URL: postgresql://cementerio:ci-only-password@127.0.0.1:5432/cementerio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python scripts/vendor_bootstrap.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test cemetery.tests --verbosity 2
      - run: node --check static/cemetery/app.js
      - run: npm test
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/package_release.py
