{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginación"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button secondary small" href="?{{ querystring }}&page={{ page.previous_page_number }}">← Anterior</a>{% endif %}{% if page.has_next %}<a class="button secondary small" href="?{{ querystring }}&page={{ page.next_page_number }}">Siguiente →</a>{% endif %}</div></nav>{% endif %}
